<!DOCTYPE html>
<html>
<head>
  <base href="/">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Dr.Book - Book. Consult. Heal.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- iOS meta tags -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Dr.Book">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png">
  <title>Dr.Book - Book. Consult. Heal.</title>
  <link rel="manifest" href="manifest.json">

  <!-- Responsive splash screen -->
  <style>
    html, body { width: 100%; height: 100%; margin: 0; }
    body { background: #fff; }
    #splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    /* Desktop splash screen */
    #splash picture {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #splash img {
      display: block;
      width: 65%;
      height: 65%;
      object-fit: contain;
    }

    /* Mobile splash screen - keep existing behavior */
    @media (max-width: 767px) {
      #splash img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
    }
    @media (max-width: 767px) {
      #splash img { object-fit: cover; }
    }
  </style>

  <script>
    function removeSplashFromWeb() {
      const splash = document.getElementById("splash");

      if (splash) {
        splash.remove();
      }

      document.getElementById("splash-branding")?.remove();
      document.body.style.background = "transparent";
    }

    // Remove splash when Flutter renders its first frame.
    window.addEventListener("flutter-first-frame", removeSplashFromWeb);

    // Safety fallback: remove splash after 15 seconds.
    window.addEventListener("load", function () {
      setTimeout(function () {
        removeSplashFromWeb();
      }, 15000);
    });
  </script>

  <!-- PDF.js for Syncfusion PDF Viewer -->
  <script type="module">
    import * as pdfjsLib from
      'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs';
    pdfjsLib.GlobalWorkerOptions.workerSrc =
      'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs';
    window.pdfjsLib = pdfjsLib;
  </script>

  <!-- Razorpay -->
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  <script>
    window.openRazorpay = function(options) {
      if (!window.Razorpay) {
        console.error("Razorpay SDK not loaded");
        return;
      }
      const checkout = new Razorpay(options);
      checkout.open();
    };
  </script>
</head>
<body>
  <div id="splash" aria-label="Dr.Book loading">
    <picture>
      <source media="(min-width: 768px)" srcset="splash/img/desktop_splash.png">
      <img src="splash/img/mobile_splash.jpeg" alt="Dr.Book - Book. Consult. Heal.">
    </picture>
  </div>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
